name: libbox-apple (sing-box core for iOS)

# Builds Libbox.xcframework from the pinned sing-box tag on a macOS runner and
# publishes it as a workflow artifact + provenance. The framework is NOT
# committed to Git; later iOS builds download the artifact and verify the
# SHA-256 against core/engine-singbox/libbox-apple.sha256 (see docs/LIBBOX_APPLE.md).
# No signing, notarization or App Store work happens here.
# Re-run 2026-09-19: artifact storage freed (16.8 GB -> 1.1 GB); retain + pin the framework.

on:
  push:
    paths:
      - "core/engine-singbox/singbox.version"
      - "core/engine-singbox/singbox.commit"
      - "core/engine-singbox/libbox-apple.sha256"
      - "tools/build-libbox-apple.sh"
      - ".github/workflows/libbox-apple.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: "gomobile targets"
        default: "ios,iossimulator"
        required: true

permissions:
  contents: read
  checks: write

concurrency:
  group: libbox-apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Libbox.xcframework (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LIBBOX_PLATFORMS: ${{ github.event.inputs.platforms || 'ios,iossimulator' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pinned inputs
        id: pin
        run: |
          set -euo pipefail
          TAG=$(tr -d ' \n' < core/engine-singbox/singbox.version)
          COMMIT=$(tr -d ' \n' < core/engine-singbox/singbox.commit)
          PIN=$(tr -d ' \n' < core/engine-singbox/libbox-apple.sha256)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"; echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "sing-box $TAG @ $COMMIT ; framework pin: $PIN"
          # The tag must still point at the pinned commit upstream (detects a moved/retagged release).
          UPSTREAM=$(git ls-remote https://github.com/SagerNet/sing-box.git "refs/tags/$TAG" | cut -f1)
          echo "upstream refs/tags/$TAG = $UPSTREAM"
          [ -n "$UPSTREAM" ] || { echo "::error::tag $TAG not found upstream"; exit 1; }
          if [ "$UPSTREAM" != "$COMMIT" ]; then
            # annotated tag? resolve the peeled commit
            PEELED=$(git ls-remote https://github.com/SagerNet/sing-box.git "refs/tags/$TAG^{}" | cut -f1)
            [ "$PEELED" = "$COMMIT" ] || { echo "::error::upstream tag $TAG points at ${PEELED:-$UPSTREAM}, pinned $COMMIT"; exit 1; }
          fi

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          sw_vers

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: libbox-apple-go-${{ steps.pin.outputs.tag }}-${{ hashFiles('tools/build-libbox-apple.sh') }}
          restore-keys: libbox-apple-go-

      - name: Build
        id: build
        env:
          SING_BOX_TAG: ${{ steps.pin.outputs.tag }}
          SING_BOX_COMMIT: ${{ steps.pin.outputs.commit }}
          LIBBOX_OUT: ${{ github.workspace }}/build/libbox-apple
        run: tools/build-libbox-apple.sh

      - name: Verify against repository pin
        run: |
          set -euo pipefail
          ACTUAL=$(cut -d' ' -f1 build/libbox-apple/Libbox.xcframework.zip.sha256)
          PIN="${{ steps.pin.outputs.pin }}"
          echo "actual=$ACTUAL pin=$PIN"
          # gomobile's Apple output is not bit-reproducible across builds (two runs on identical
          # Go 1.25.14 / Xcode 16.4 / macos-15 produced a320843e… and 52b441d5…), so the pin identifies
          # the ONE artifact that was reviewed and accepted, not "any build of this tag". A fresh build
          # therefore reports, but does not fail on, a different hash; the hard check happens where
          # the artifact is consumed (download → shasum -c → compare with the pin).
          if [ "$PIN" = "unpinned" ]; then
            echo "::notice::libbox-apple.sha256 is unpinned; this build's hash is $ACTUAL (pin it only once the artifact is retained somewhere)"
          elif [ "$PIN" != "$ACTUAL" ]; then
            echo "::warning::fresh build hash $ACTUAL differs from pinned artifact $PIN — expected for a non-reproducible toolchain; compare per_file_sha256 in the provenance check-run to see which slices differ"
          else
            echo "pin reproduced exactly"
          fi

      - name: Summary + check-run (provenance stays readable even if artifact storage is full)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "build: ${BUILD_OUTCOME}"
            echo "iOS runtime verification: NOT PERFORMED (framework built + structurally validated only)"
            if [ -f build/libbox-apple/PROVENANCE.txt ]; then cat build/libbox-apple/PROVENANCE.txt; else echo "build failed before provenance was written"; fi
            [ -f build/libbox-apple/Libbox.xcframework.zip ] && ls -l build/libbox-apple/Libbox.xcframework.zip
          } > build/libbox-apple-summary.txt || true
          { echo "## Libbox.xcframework"; echo '```'; cat build/libbox-apple-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os, subprocess
          text = open("build/libbox-apple-summary.txt", errors="replace").read()[:60000]
          body = {"name": "libbox-apple-provenance", "head_sha": os.environ["GITHUB_SHA"], "status": "completed", "conclusion": "neutral",
                  "output": {"title": "Libbox.xcframework provenance", "summary": "Output of tools/build-libbox-apple.sh", "text": "```\n" + text + "\n```"}}
          subprocess.run(["gh", "api", "-X", "POST", "-H", "Accept: application/vnd.github+json", "--input", "-",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs"], input=json.dumps(body).encode(), check=False)
          PY

      # Artifact storage is an account-level quota; when it is exhausted the upload is refused even
      # though the build is valid. The provenance check-run above is the authoritative record in that
      # case, and the step below turns the refusal into a visible warning instead of a false "build failed".
      - uses: actions/upload-artifact@v4
        id: upload
        if: success()
        with:
          name: libbox-xcframework-${{ steps.pin.outputs.tag }}
          path: |
            build/libbox-apple/Libbox.xcframework.zip
            build/libbox-apple/Libbox.xcframework.zip.sha256
            build/libbox-apple/PROVENANCE.txt
          retention-days: 90
          if-no-files-found: error

      - name: Artifact upload status (self-verified via API)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo "upload step outcome: ${UPLOAD_OUTCOME}"
            echo "artifact-id: ${ARTIFACT_ID:-<none>}"
            echo "artifact-url: ${ARTIFACT_URL:-<none>}"
            echo "artifact-digest: ${ARTIFACT_DIGEST:-<none>}"
            echo "API view of this run's artifacts:"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.total_count, (.artifacts[] | "  id=\(.id) name=\(.name) size=\(.size_in_bytes) expires=\(.expires_at)")' || echo "  (api query failed)"
          } | tee build/artifact-status.txt
          python3 - <<'PY'
          import json, os, subprocess
          text = open("build/artifact-status.txt", errors="replace").read()[:20000]
          body = {"name": "libbox-apple-artifact", "head_sha": os.environ["GITHUB_SHA"], "status": "completed",
                  "conclusion": "success" if os.environ.get("ARTIFACT_ID") else "neutral",
                  "output": {"title": "Libbox.xcframework artifact", "summary": "upload-artifact outputs + API listing", "text": "```\n" + text + "\n```"}}
          subprocess.run(["gh", "api", "-X", "POST", "-H", "Accept: application/vnd.github+json", "--input", "-",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs"], input=json.dumps(body).encode(), check=False)
          PY
          if [ "${UPLOAD_OUTCOME}" != "success" ] || [ -z "${ARTIFACT_ID}" ]; then
            echo "::warning::Libbox.xcframework artifact was NOT retained (outcome=${UPLOAD_OUTCOME}, id=${ARTIFACT_ID:-none}); see libbox-apple-artifact check-run"
          fi
