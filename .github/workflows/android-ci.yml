name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libbox:
    uses: ./.github/workflows/libbox.yml

  build:
    name: Build & test
    needs: libbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore libbox.aar
        uses: actions/cache/restore@v4
        with:
          path: core/engine-singbox/libs
          key: ${{ needs.libbox.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Verify libbox checksum pin
        run: |
          set -e
          ACTUAL=$(sha256sum core/engine-singbox/libs/libbox.aar | cut -d' ' -f1)
          PIN=$(tr -d ' \n' < core/engine-singbox/libbox.sha256)
          echo "actual=$ACTUAL pin=$PIN"
          if [ "$PIN" != "unpinned" ] && [ "$PIN" != "$ACTUAL" ]; then
            echo "::error::libbox.aar checksum does not match core/engine-singbox/libbox.sha256"; exit 1
          fi
          if [ "$PIN" = "unpinned" ]; then echo "::warning::libbox.sha256 is unpinned — pin it to $ACTUAL"; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (JVM modules + Android unit tests)
        run: ./gradlew --no-daemon --stacktrace test testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
