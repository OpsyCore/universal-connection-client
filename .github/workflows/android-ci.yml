name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libbox:
    uses: ./.github/workflows/libbox.yml

  build:
    name: Build & test
    needs: libbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore libbox.aar
        uses: actions/cache/restore@v4
        with:
          path: core/engine-singbox/libs
          key: ${{ needs.libbox.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Verify libbox checksum pin
        run: |
          set -e
          ACTUAL=$(sha256sum core/engine-singbox/libs/libbox.aar | cut -d' ' -f1)
          PIN=$(tr -d ' \n' < core/engine-singbox/libbox.sha256)
          echo "actual=$ACTUAL pin=$PIN"
          if [ "$PIN" != "unpinned" ] && [ "$PIN" != "$ACTUAL" ]; then
            echo "::error::libbox.aar checksum does not match core/engine-singbox/libbox.sha256"; exit 1
          fi
          if [ "$PIN" = "unpinned" ]; then echo "::warning::libbox.sha256 is unpinned — pin it to $ACTUAL"; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Core boundary check (no engine leakage into core-agnostic modules)
        run: tools/check-core-boundary.sh

      - name: Secret scan
        run: tools/check-secrets.sh

      - name: Licence / notice check
        run: tools/check-notices.sh

      - name: Unit tests (JVM modules + Android unit tests)
        run: |
          set -o pipefail; mkdir -p build
          ./gradlew --no-daemon --continue test testSingboxDebugUnitTest 2>&1 | tee build/gradle-test.log

      - name: Assemble debug APK
        if: always()
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleSingboxDebug 2>&1 | tee build/gradle-assemble.log

      - name: Lint
        if: always()
        run: ./gradlew --no-daemon :app:lintSingboxDebug 2>&1 | tee build/gradle-lint.log

      # ---- Release artifacts (minified). Signing only when the four secrets are
      #      configured; otherwise the artifacts are produced UNSIGNED and named so.
      - name: Materialise release keystore (only if secrets exist)
        id: keystore
        if: always()
        env:
          KEYSTORE_B64: ${{ secrets.UCC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"; echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::notice::No UCC_KEYSTORE_BASE64 secret — release artifacts will be UNSIGNED"
          fi

      - name: Build minified release APK + AAB
        if: always()
        env:
          UCC_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          UCC_KEYSTORE_PASSWORD: ${{ secrets.UCC_KEYSTORE_PASSWORD }}
          UCC_KEY_ALIAS: ${{ secrets.UCC_KEY_ALIAS }}
          UCC_KEY_PASSWORD: ${{ secrets.UCC_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleSingboxRelease :app:bundleSingboxRelease 2>&1 | tee build/gradle-release.log
          ls -la app/build/outputs/apk/singbox/release app/build/outputs/bundle/singboxRelease

      - name: Inspect release artifacts
        if: always()
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/singbox/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/singboxRelease/*.aab | head -1)
          tools/inspect-release.sh "$APK" "$AAB" 2>&1 | tee build/release-inspection.txt
          echo "--- debug vs release size"; du -h app/build/outputs/apk/singbox/debug/*.apk "$APK" "$AAB"
          echo "--- R8 mapping: $(wc -l < app/build/outputs/mapping/singboxRelease/mapping.txt) lines"
          echo "--- resources removed by shrinker:"; grep -c "Skipped unused resource" app/build/outputs/mapping/singboxRelease/resources.txt 2>/dev/null || true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish error excerpt as check-run output (readable via API)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            for f in build/gradle-test.log build/gradle-assemble.log build/gradle-lint.log build/gradle-release.log build/release-inspection.txt; do
              [ -f "$f" ] || continue
              echo "===== $f"
              grep -E "^e: |Unresolved reference|What went wrong|Could not resolve|Could not find|> Task .* FAILED|tests completed|BUILD (SUCCESSFUL|FAILED)|FAILED$|Exception|error" "$f" | head -120
              echo "--- tail:"; tail -60 "$f"
              echo "--- context after 'What went wrong':"
              grep -A 25 "What went wrong" "$f" | head -80
            done
            echo "===== failed tests"
            grep -rh -B1 -A3 -E "<failure|<error" --include='TEST-*.xml' . 2>/dev/null | tr -d '\r' | head -120
          } > build/error-excerpt.txt || true
          python3 - <<'PY'
          import json, os, subprocess
          text = open("build/error-excerpt.txt", errors="replace").read()[:60000]
          body = {"name": "gradle-errors", "head_sha": os.environ["GITHUB_SHA"], "status": "completed", "conclusion": "neutral",
                  "output": {"title": "Gradle error excerpt", "summary": "see text", "text": "```\n" + text + "\n```"}}
          subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", "--input", "-"], input=json.dumps(body).encode(), check=False)
          PY

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/singbox/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'UNSIGNED' }}
          path: app/build/outputs/apk/singbox/release/*.apk
          if-no-files-found: ignore

      - name: Upload release AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'UNSIGNED' }}
          path: app/build/outputs/bundle/singboxRelease/*.aab
          if-no-files-found: ignore

      - name: Upload R8 mapping (needed to de-obfuscate crash traces of this build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/singboxRelease/
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/test-results/**/*.xml
            build/release-inspection.txt
          if-no-files-found: ignore
