name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libbox:
    uses: ./.github/workflows/libbox.yml

  build:
    name: Build & test
    needs: libbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore libbox.aar
        uses: actions/cache/restore@v4
        with:
          path: core/engine-singbox/libs
          key: ${{ needs.libbox.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Verify libbox checksum pin
        run: |
          set -e
          ACTUAL=$(sha256sum core/engine-singbox/libs/libbox.aar | cut -d' ' -f1)
          PIN=$(tr -d ' \n' < core/engine-singbox/libbox.sha256)
          echo "actual=$ACTUAL pin=$PIN"
          if [ "$PIN" != "unpinned" ] && [ "$PIN" != "$ACTUAL" ]; then
            echo "::error::libbox.aar checksum does not match core/engine-singbox/libbox.sha256"; exit 1
          fi
          if [ "$PIN" = "unpinned" ]; then echo "::warning::libbox.sha256 is unpinned — pin it to $ACTUAL"; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (JVM modules + Android unit tests)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue test testDebugUnitTest 2>&1 | tee build/gradle-test.log

      - name: Assemble debug APK
        if: always()
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee build/gradle-assemble.log

      - name: Lint
        if: always()
        run: ./gradlew --no-daemon :app:lintDebug 2>&1 | tee build/gradle-lint.log

      - name: Publish errors as annotations (readable via API)
        if: always()
        run: |
          for f in build/gradle-test.log build/gradle-assemble.log build/gradle-lint.log; do
            [ -f "$f" ] || continue
            grep -E "^e: |Unresolved reference|What went wrong|Could not resolve|Could not find|> Task .* FAILED|tests completed|BUILD (SUCCESSFUL|FAILED)" "$f" \
              | sed 's/%/%25/g' | head -60 | while IFS= read -r line; do echo "::error title=$(basename "$f")::${line:0:600}"; done
          done
          grep -rh -B1 -A2 -E "<failure|<error" --include='TEST-*.xml' . 2>/dev/null | tr -d '\r' | head -80 \
            | while IFS= read -r line; do echo "::error title=test::${line:0:600}"; done
          true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
